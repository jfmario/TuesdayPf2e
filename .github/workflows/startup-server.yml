name: Startup Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1'  # Mon 5 PM EST / 6 PM EDT

jobs:
  startup:
    name: Start EC2 and update DNS
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start EC2 instance and update Route 53
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          RECORD_NAME: ${{ vars.ROUTE53_RECORD_NAME }}
          RECORD_TTL: ${{ vars.ROUTE53_TTL }}
        run: |
          set -euo pipefail

          TTL="${RECORD_TTL:-300}"

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Current instance state: $STATE"

          if [ "$STATE" = "running" ]; then
            echo "Instance $INSTANCE_ID is already running. Skipping start; will sync Route 53."
          else
            if [ "$STATE" = "pending" ]; then
              echo "Instance $INSTANCE_ID is already pending. Waiting for it to become running..."
            else
              echo "Starting instance $INSTANCE_ID..."
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            fi
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            echo "Instance is running. Waiting for public IP..."
          fi

          PUBLIC_IP=""
          for i in $(seq 1 30); do
            PUBLIC_IP=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)

            if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
              break
            fi

            echo "Public IP not yet available (attempt $i/30). Retrying in 10s..."
            sleep 10
            PUBLIC_IP=""
          done

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "Error: Instance $INSTANCE_ID has no public IP after waiting."
            exit 1
          fi

          echo "Public IP: $PUBLIC_IP"

          # Ensure trailing dot for Route 53 FQDN if missing
          FQDN="$RECORD_NAME"
          case "$FQDN" in
            *.) ;;
            *) FQDN="${FQDN}." ;;
          esac

          CHANGE_BATCH=$(cat <<EOF
          {
            "Comment": "Upsert A record from Startup Server workflow",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$FQDN",
                  "Type": "A",
                  "TTL": $TTL,
                  "ResourceRecords": [
                    { "Value": "$PUBLIC_IP" }
                  ]
                }
              }
            ]
          }
          EOF
          )

          echo "Updating Route 53 A record $FQDN -> $PUBLIC_IP (TTL=$TTL)..."
          CHANGE_ID=$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "$CHANGE_BATCH" \
            --query 'ChangeInfo.Id' \
            --output text)

          echo "Waiting for DNS change $CHANGE_ID to sync..."
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"

          FINAL_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Done. Instance=$INSTANCE_ID state=$FINAL_STATE public_ip=$PUBLIC_IP dns=$FQDN"
