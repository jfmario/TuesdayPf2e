name: Shut Down Server

on:
  workflow_dispatch:

jobs:
  shutdown:
    name: Stop EC2 instance
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Stop EC2 instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Current instance state: $STATE"

          if [ "$STATE" = "stopped" ] || [ "$STATE" = "stopping" ]; then
            echo "Instance $INSTANCE_ID is already $STATE. Nothing to do."
            exit 0
          fi

          echo "Stopping instance $INSTANCE_ID..."
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"

          FINAL_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Instance $INSTANCE_ID is now $FINAL_STATE."
